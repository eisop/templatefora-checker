plugins {
    id 'java'
    id 'maven-publish'
}

// The Checker Framework version to build against. Override with "-PcfVersion=<version>" to use
// a locally-built Checker Framework: publish that checkout with "./gradlew publishToMavenLocal"
// and pass the version it reports.
def cfVersion = findProperty('cfVersion')

repositories {
    // Only consulted when -PcfVersion names a locally published build, and scoped to
    // io.github.eisop so nothing else can be served from a developer's local repository.
    if (cfVersion) {
        mavenLocal {
            content {
                includeGroup 'io.github.eisop'
            }
        }
    }
    // Use Maven Central for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
}

configurations {
    // for putting Error Prone javac in bootclasspath for running tests
    errorproneJavac
}

ext.versions = [
        eisopVersion: cfVersion ?: '3.49.5-eisop1',
]

// The JDK to compile and test against. Defaults to whatever JDK is running Gradle itself.
// Override with -PuseJdkVersion=<N> (or the ORG_GRADLE_PROJECT_useJdkVersion environment
// variable CI sets) to target a JDK different from the one running Gradle -- needed because
// Gradle 9 requires JDK 17+ to run at all, independent of which JDK this project's own code
// should be compiled and tested against. Mirrors checker-framework's own root build.gradle and
// .github/workflows/ci.yml, which use the same property name for the same reason.
def currentRuntimeJavaVersion = JavaVersion.current().majorVersion as int
def useJdkVersionProp = findProperty('useJdkVersion')
def useJdkVersionInt = useJdkVersionProp == null ? currentRuntimeJavaVersion : (useJdkVersionProp as int)
// Toolchains have overhead (Gradle must locate or download a matching JDK), so only ask for one
// when actually targeting a JDK other than the one already running Gradle.
def useToolchain = (useJdkVersionInt != currentRuntimeJavaVersion)

dependencies {
    // This dependency is found on compile classpath of this component and consumers.
    implementation "io.github.eisop:checker:${versions.eisopVersion}"
    implementation "io.github.eisop:checker-qual:${versions.eisopVersion}"

    compileOnly "com.google.errorprone:javac:9+181-r4173-1"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.github.eisop:framework-test:${versions.eisopVersion}"

    errorproneJavac "com.google.errorprone:javac:9+181-r4173-1"
}

tasks.withType(JavaCompile).all {
    sourceCompatibility = 1.8
    options.compilerArgs.add("-Xlint:all")
    if (useToolchain) {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
}

javadoc {
    if (useToolchain) {
        javadocTool = javaToolchains.javadocToolFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
}

// Add `mavenLocal()` in `repositories`, then run `./gradlew publishToMavenLocal`
// to publish your checker to your local Maven repository.
publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'io.github.eisop'
            artifactId = 'templatefora-checker'
            version = '0.1-SNAPSHOT'

            from components.java
        }
    }
}

test {
    inputs.files("tests/templatefora")
    if (useToolchain) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
    // Checked against the JDK this task actually runs the tests under (useJdkVersionInt), not
    // JavaVersion.current() (the JDK running Gradle itself, which the toolchain above may have
    // just overridden for this task).
    if (useJdkVersionInt < 9) {
        jvmArgs "-Xbootclasspath/p:${configurations.errorproneJavac.asPath}"
    } else {
        // A list of add-export and add-open arguments to be used when running the Checker Framework.
        // Keep this list in sync with the list in the Checker Framework manual.
        var compilerArgsForRunningCF = [
                // These are required in Java 16+ because the --illegal-access option is set to deny
                // by default.  None of these packages are accessed via reflection, so the module
                // only needs to be exported, but not opened.
                "--add-exports", "jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
                // Required because the Checker Framework reflectively accesses private members in com.sun.tools.javac.comp.
                "--add-opens", "jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
        ]
        jvmArgs += compilerArgsForRunningCF
    }
    testLogging {
        showStandardStreams = true
        // Show the found unexpected diagnostics and expected diagnostics not found.
        exceptionFormat = "full"
        events "failed"
    }
}

clean.doFirst {
    delete "${rootDir}/tests/build/"
}

task printClasspath {
    description = 'Prints the runtime classpath of the checker. ' +
            'When typechecking, put the output of this task on either the ' +
            'processor path or the classpath of the project being type-checed.'
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

sourceSets {
    main {
        resources {
            // ensures that any .stub files present in the same directory as
            // the checker source code are copied into the distributed jar
            srcDirs += ['src/main/java']
        }
    }
}
