plugins {
    id 'java'
    id 'maven-publish'
}

repositories {
    // Use Maven Central for resolving your dependencies.
    // You can declare any Maven/Ivy/file repository here.
    mavenCentral()
}

configurations {
    // for putting Error Prone javac in bootclasspath for running tests
    errorproneJavac
}

ext.versions = [
        eisopVersion: '3.49.5-eisop1',
]

// The JDK to compile and test against. Defaults to whatever JDK is running Gradle itself.
// Override with -PuseJdkVersion=<N> (or the ORG_GRADLE_PROJECT_useJdkVersion environment
// variable CI sets) to target a JDK different from the one running Gradle -- needed because
// Gradle 9 requires JDK 17+ to run at all, independent of which JDK this project's own code
// should be compiled and tested against. Mirrors checker-framework's own root build.gradle and
// .github/workflows/ci.yml, which use the same property name for the same reason.
def currentRuntimeJavaVersion = JavaVersion.current().majorVersion as int
def useJdkVersionProp = findProperty('useJdkVersion')
def useJdkVersionInt = useJdkVersionProp == null ? currentRuntimeJavaVersion : (useJdkVersionProp as int)
// Toolchains have overhead (Gradle must locate or download a matching JDK), so only ask for one
// when actually targeting a JDK other than the one already running Gradle.
def useToolchain = (useJdkVersionInt != currentRuntimeJavaVersion)

// Set this variable to [true] while using a local checkout of the Checker Framework, pointed to
// by the CHECKERFRAMEWORK environment variable. Left [false] here (this repository's default,
// and what both this project's own CI and checker-framework's own :checker:templateforaCheckerTests
// CI job -- which clones this repository fresh and builds it -- run against, neither of which sets
// CHECKERFRAMEWORK) even though the binary (pre-parsed) stub file support that
// generateBinaryStubFiles (below) and example-client exercise has not shipped in a released eisop
// version yet: set this to [true] locally to exercise that work before it ships, but do not commit
// it that way, since CI would then fail everywhere for lacking that environment variable. Revisit
// once versions.eisopVersion names a release that includes it. An "ext" property (not a local
// "def"), so example-client/build.gradle -- which needs its own, separate Checker Framework
// dependency, since project(':')'s own dependency on it is "implementation" and so not
// transitively visible to a project that depends on project(':') -- can read the same flag instead
// of duplicating it.
ext.checkerframework_local = false

dependencies {
    // This dependency is found on compile classpath of this component and consumers.
    if (checkerframework_local) {
        implementation files("${System.getenv('CHECKERFRAMEWORK')}/checker/dist/checker-qual.jar")
        implementation files("${System.getenv('CHECKERFRAMEWORK')}/checker/dist/checker.jar")
    }
    else {
        implementation "io.github.eisop:checker:${versions.eisopVersion}"
        implementation "io.github.eisop:checker-qual:${versions.eisopVersion}"
    }

    compileOnly "com.google.errorprone:javac:9+181-r4173-1"

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "io.github.eisop:framework-test:${versions.eisopVersion}"

    errorproneJavac "com.google.errorprone:javac:9+181-r4173-1"
}

tasks.withType(JavaCompile).all {
    sourceCompatibility = 1.8
    options.compilerArgs.add("-Xlint:all")
    if (useToolchain) {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
}

javadoc {
    if (useToolchain) {
        javadocTool = javaToolchains.javadocToolFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
}

// Add `mavenLocal()` in `repositories`, then run `./gradlew publishToMavenLocal`
// to publish your checker to your local Maven repository.
publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'io.github.eisop'
            artifactId = 'templatefora-checker'
            version = '0.1-SNAPSHOT'

            from components.java
        }
    }
}

test {
    inputs.files("tests/templatefora")
    if (useToolchain) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(useJdkVersionInt)
        }
    }
    // Checked against the JDK this task actually runs the tests under (useJdkVersionInt), not
    // JavaVersion.current() (the JDK running Gradle itself, which the toolchain above may have
    // just overridden for this task).
    if (useJdkVersionInt < 9) {
        jvmArgs "-Xbootclasspath/p:${configurations.errorproneJavac.asPath}"
    } else {
        // A list of add-export and add-open arguments to be used when running the Checker Framework.
        // Keep this list in sync with the list in the Checker Framework manual.
        var compilerArgsForRunningCF = [
                // These are required in Java 16+ because the --illegal-access option is set to deny
                // by default.  None of these packages are accessed via reflection, so the module
                // only needs to be exported, but not opened.
                "--add-exports", "jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
                "--add-exports", "jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED",
                // Required because the Checker Framework reflectively accesses private members in com.sun.tools.javac.comp.
                "--add-opens", "jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
        ]
        jvmArgs += compilerArgsForRunningCF
    }
    testLogging {
        showStandardStreams = true
        // Show the found unexpected diagnostics and expected diagnostics not found.
        exceptionFormat = "full"
        events "failed"
    }
}

clean.doFirst {
    delete "${rootDir}/tests/build/"
}

task printClasspath {
    description = 'Prints the runtime classpath of the checker. ' +
            'When typechecking, put the output of this task on either the ' +
            'processor path or the classpath of the project being type-checed.'
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

sourceSets {
    main {
        resources {
            // ensures that any .stub files present in the same directory as
            // the checker source code are copied into the distributed jar
            srcDirs += ['src/main/java']
        }
    }
}

// Pre-parses every .astub file under src/main/java (e.g. jdk.astub) into a sibling
// <name>.astub.bin.gz, which the Checker Framework reads instead of text-parsing the .astub
// file, as long as the sibling is up to date; see org.checkerframework.framework.stubifier
// .BinaryStubFileGenerator's javadoc, and the Checker Framework manual's "Using a binary
// (pre-parsed) stub file" section, for how staleness is detected and reported.
//
// Writes into a build/ staging directory rather than beside the .astub source, because
// src/main/java also holds hand-written source: an output declared there would let Gradle
// believe it owns everything under src/main/java, including that source, and delete files it
// does not recognize as this task's own output on a stale-output cleanup. The staging directory
// is then added as an extra resources srcDir below, so the generated sibling is packaged into
// the distributed jar right beside jdk.astub itself -- this is not test-only output.
def binaryStubFilesDir = layout.buildDirectory.dir('generated/binaryStubFiles')
tasks.register('generateBinaryStubFiles', JavaExec) {
    group = 'Build'
    description = 'Pre-parse the .astub files under src/main/java into the binary stub format.'
    // Not sourceSets.main.runtimeClasspath: that includes sourceSets.main.output, which is
    // itself produced by processResources -- and processResources depends on this task (below),
    // so runtimeClasspath here would create a dependency cycle. classesDirs (compileJava's
    // output) is enough: jdk.astub refers to this project's own
    // org.checkerframework.checker.templatefora.qual annotations (TemplateforaBottom), and
    // BinaryStubFileGenerator loads every annotation type a stub file uses, reflectively, to
    // read its @Target -- so those compiled classes must be on the classpath, but nothing from
    // processResources's own output is needed.
    classpath = sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath
    mainClass = 'org.checkerframework.framework.stubifier.BinaryStubFileGenerator'
    inputs.files(fileTree('src/main/java') { include '**/*.astub' })
    outputs.dir(binaryStubFilesDir)
    args(binaryStubFilesDir.get().asFile.absolutePath, file('src/main/java').absolutePath)
}
sourceSets.main.resources.srcDir(binaryStubFilesDir)
// srcDir() alone does not make processResources depend on generateBinaryStubFiles -- it must be
// declared explicitly, or a fresh checkout can package a stale (or missing) binary sibling.
tasks.named('processResources').configure { dependsOn 'generateBinaryStubFiles' }
