plugins {
    id 'java'
}

repositories {
    // Matches the root project: only consulted when -PcfVersion names a locally published
    // Checker Framework, and scoped to io.github.eisop. The version itself comes from
    // rootProject.versions.eisopVersion, which honours -PcfVersion.
    if (rootProject.findProperty('cfVersion')) {
        mavenLocal {
            content {
                includeGroup 'io.github.eisop'
            }
        }
    }
    mavenCentral()
}

dependencies {
    implementation "io.github.eisop:checker:${rootProject.versions.eisopVersion}"
    implementation "io.github.eisop:checker-qual:${rootProject.versions.eisopVersion}"
}

task copySources(type: Copy) {
    includeEmptyDirs = false
    doFirst {
        // Delete the directory in case a previously copied file should no longer be in checker-qual
        delete file('src/main/java')
    }

    from files('../src/main/java')
    // Replace the path below with your actual path.
    include '**/org/checkerframework/checker/templatefora/qual/**'

    // Make files read only.
    filePermissions {
        user.read = true
        group.read = true
        other.read = true
    }

    into file('src/main/java')
}

jar {
    dependsOn copySources
    manifest {
        attributes('Export-Package': '*')
    }
}

compileJava {
    dependsOn copySources
}

clean {
    delete file('src/')
}
